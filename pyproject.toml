# Monorepo: file này chỉ chứa cấu hình công cụ (ruff, pytest, mypy).
# Thư viện của từng dịch vụ khai báo trong requirements.txt riêng của dịch vụ đó.
[project]
name = "cryptopulse"
version = "0.1.0"
description = "Simulated crypto market with automated ML lifecycle and DevOps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MinhLight2406" }]

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "services"]
pythonpath = [".", "libs"]
addopts = "-ra -q --strict-markers"

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- mypy (chưa chạy trong CI, bật sau) ----------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
